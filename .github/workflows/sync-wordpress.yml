# Checks ukreiif.com every hour and opens a pull request when Leaders Group
# speakers, attendees or member logos have changed. Merge it to publish.
#
# Runs on our own PC (self-hosted runner), because ukreiif.com's firewall
# blocks GitHub's servers. If the PC is off, the run waits until it is back.
name: Sync from WordPress

on:
  schedule:
    - cron: '17 * * * *'   # every hour, at :17
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wordpress-sync

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - run: python -m pip install --quiet -r sync/requirements.txt

      - name: Compare with WordPress
        run: python sync/sync_wordpress.py --summary "${{ runner.temp }}/summary.md"

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: wordpress-sync
          delete-branch: true
          add-paths: pages/*.html
          commit-message: Sync Leaders Group content from WordPress
          title: Sync from WordPress
          body-path: ${{ runner.temp }}/summary.md
